<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KI-Kompetenzprofil · Patrick Mitschke</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='7' cy='26' r='3' fill='none' stroke='%231B9EA6' stroke-width='1.6'/%3E%3Ccircle cx='25' cy='26' r='3' fill='none' stroke='%231B9EA6' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='7' r='3' fill='none' stroke='%231B9EA6' stroke-width='1.6'/%3E%3Cline x1='9.5' y1='24.5' x2='14' y2='10' stroke='%231B9EA6' stroke-width='1.3'/%3E%3Cline x1='22.5' y1='24.5' x2='18' y2='10' stroke='%231B9EA6' stroke-width='1.3'/%3E%3Cline x1='10' y1='26' x2='22' y2='26' stroke='%231B9EA6' stroke-width='1.3'/%3E%3Ccircle cx='16' cy='17' r='2.2' fill='%231B9EA6' opacity='.65'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D1820;--bg2:#131F2A;--bg3:#182530;
  --su:rgba(255,255,255,.032);--su2:rgba(255,255,255,.058);
  --br:rgba(170,215,228,.08);--br2:rgba(170,215,228,.16);
  --tx:#B8D0DA;--mu:#4A6272;--di:#7AAAB8;
  --pt:#1B9EA6;--ptg:rgba(27,158,166,.11);--ptb:rgba(27,158,166,.30);
  --cl:#C8794A;--clg:rgba(200,121,74,.10);--clb:rgba(200,121,74,.28);
  --gm:#5A9DF0;--gmg:rgba(90,157,240,.10);--gmb:rgba(90,157,240,.28);
  --nl:#9EB8B0;--nlg:rgba(158,184,176,.07);--nlb:rgba(158,184,176,.22);
  --px:#7B94C2;--pxg:rgba(123,148,194,.08);--pxb:rgba(123,148,194,.24);
  --ap:#9270C2;--apg:rgba(146,112,194,.10);--apb:rgba(146,112,194,.28);
  --af:#4E80AA;--afg:rgba(78,128,170,.10);--afb:rgba(78,128,170,.28);
  --av:#3E9A70;--avg:rgba(62,154,112,.10);--avb:rgba(62,154,112,.28);
  --am:#A07830;--amg:rgba(160,120,48,.10);--amb:rgba(160,120,48,.28);
  --gn:#3E9A70;--rd:#A05050;--yw:#A08030;
  --r:10px;--rs:6px;--rx:4px;
  --ff:'Bricolage Grotesque',sans-serif;--fm:'JetBrains Mono',monospace;
}
body{background:var(--bg);color:var(--tx);font-family:var(--ff);min-height:100vh;overflow-x:hidden;line-height:1.6}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(27,158,166,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(27,158,166,.02) 1px,transparent 1px);background-size:52px 52px;pointer-events:none;z-index:0}
body::after{content:'';position:fixed;top:-20%;left:50%;transform:translateX(-50%);width:60vw;height:45vh;background:radial-gradient(ellipse,rgba(27,158,166,.055) 0%,transparent 65%);pointer-events:none;z-index:0}

/* NAV */
.nav{position:sticky;top:0;z-index:200;background:rgba(13,24,32,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--br);padding:0 28px;display:flex;align-items:center}
.nav-logo{font-family:var(--fm);font-size:.72rem;color:var(--pt);letter-spacing:.12em;padding:16px 20px 16px 0;border-right:1px solid var(--br);margin-right:2px;white-space:nowrap}
.nt{background:none;border:none;color:var(--mu);font-family:var(--ff);font-size:.84rem;font-weight:600;padding:18px 16px;cursor:pointer;transition:color .2s;position:relative;white-space:nowrap}
.nt:hover{color:var(--tx)}.nt.a{color:var(--tx)}
.nt.a::after{content:'';position:absolute;bottom:0;left:12px;right:12px;height:2px;background:var(--pt);border-radius:2px 2px 0 0}

/* LAYOUT */
.main{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:52px 28px 100px}
.sec{display:none}.sec.a{display:block;animation:sIn .26s ease}
@keyframes sIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* SEC HEADER */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.spt{font-size:1.5rem;font-weight:800;letter-spacing:-.025em}
.guide-btn{background:none;border:1px solid var(--br2);color:var(--mu);font-family:var(--fm);font-size:.64rem;padding:5px 12px;border-radius:100px;cursor:pointer;transition:color .2s,border-color .2s;letter-spacing:.06em}
.guide-btn:hover{color:var(--pt);border-color:var(--ptb)}

/* HERO */
.hero{padding:40px 0 44px;border-bottom:1px solid var(--br);margin-bottom:36px}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--ptg);border:1px solid var(--ptb);color:var(--pt);font-family:var(--fm);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;padding:5px 13px;border-radius:100px;margin-bottom:18px}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--pt);animation:bl 2.2s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
.hero h1{font-size:clamp(1.8rem,4.5vw,3.1rem);font-weight:800;line-height:1.08;letter-spacing:-.03em;margin-bottom:8px}
.hero h1 span{color:var(--pt)}
.hero-role{font-family:var(--fm);font-size:.76rem;color:var(--mu);margin-bottom:14px}
.hero-desc{font-size:.9rem;color:var(--di);max-width:520px;line-height:1.76;margin-bottom:14px}
.proj-block{background:var(--su);border:1px solid var(--br);border-left:2px solid var(--pt);border-radius:0 var(--rs) var(--rs) 0;padding:11px 16px;max-width:520px}
.proj-block-title{font-size:1.45rem;font-weight:800;color:var(--pt);letter-spacing:-.025em;margin-bottom:8px}
.proj-block-text{font-size:.82rem;color:var(--di);line-height:1.65}

/* METHODIK */
.meth{margin-bottom:36px;padding-bottom:36px;border-bottom:1px solid var(--br)}
.meth-lbl{font-family:var(--ff);font-size:1.25rem;font-weight:800;color:var(--pt);letter-spacing:-.02em;margin-bottom:10px}
.meth-intro{font-size:.88rem;color:var(--di);line-height:1.76;margin-bottom:20px;max-width:580px}
.meth-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:11px}
.meth-card{background:var(--su);border:1px solid var(--br);border-radius:var(--r);padding:18px;transition:border-color .2s;display:flex;flex-direction:column;cursor:pointer;user-select:none}
.meth-card:hover{border-color:var(--ptb)}
.meth-card.o{border-color:var(--pt)}
.meth-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px}
.meth-marker{line-height:0;flex-shrink:0}
.meth-marker svg{display:block}
.meth-chev{width:22px;height:22px;border-radius:50%;border:1px solid var(--br);background:none;color:var(--mu);display:flex;align-items:center;justify-content:center;font-size:8px;transition:transform .25s,color .2s,border-color .2s,background .2s;flex-shrink:0;line-height:1;pointer-events:none}
.meth-card.o .meth-chev{transform:rotate(180deg);color:var(--pt);border-color:var(--ptb);background:var(--ptg)}
.meth-title{font-size:.95rem;font-weight:700;color:var(--tx);letter-spacing:-.015em;margin-bottom:4px}
.meth-tag{font-family:var(--ff);font-size:.82rem;color:var(--pt);font-weight:600;letter-spacing:-.005em;line-height:1.4;margin-bottom:13px}
.meth-text{display:none;font-size:.74rem;color:var(--di);font-family:var(--fm);line-height:1.7;margin-bottom:13px}
.meth-card.o .meth-text{display:block;animation:fIn .22s ease}
@keyframes fIn{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:translateY(0)}}

/* CARD ANCHORS (Mini-Visuals im Boardmix-Stil) */
.meth-anchor{margin-top:0}
.ma-code{background:rgba(0,0,0,.24);border:1px solid var(--br);border-left:2px solid var(--ptb);border-radius:var(--rx);padding:9px 11px;font-family:var(--fm);font-size:.6rem;color:var(--di);line-height:1.65;overflow-x:auto}
.ma-code-line{display:block;white-space:nowrap}
.ma-code-indent{padding-left:14px;color:var(--mu)}
.ma-code-br{color:var(--pt)}
.ma-code-nm{color:var(--di)}
.ma-seq{padding:10px;background:rgba(0,0,0,.2);border:1px solid var(--br);border-radius:var(--rx)}
.ma-seq-row{display:flex;align-items:center;gap:5px;justify-content:center;margin-bottom:7px;flex-wrap:wrap}
.ma-tool{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-weight:800;font-size:.62rem;border:1px solid;flex-shrink:0}
.ma-tc{background:var(--clg);border-color:var(--clb);color:var(--cl)}
.ma-tg{background:var(--gmg);border-color:var(--gmb);color:var(--gm)}
.ma-tn{background:var(--nlg);border-color:var(--nlb);color:var(--nl)}
.ma-tp{background:var(--pxg);border-color:var(--pxb);color:var(--px)}
.ma-tcheck{background:var(--ptg);border-color:var(--ptb);color:var(--pt);font-size:.8rem}
.ma-arrow{color:var(--mu);font-size:.72rem;line-height:1;flex-shrink:0}
.ma-seq-lbl{font-family:var(--fm);font-size:.55rem;color:var(--mu);letter-spacing:.03em;text-align:center;line-height:1.5}

/* CARD CTA (Tab-Teaser) — wird durch margin-top:auto an den unteren Card-Rand gedrückt */
.meth-cta{font-family:var(--fm);font-size:.64rem;color:var(--pt);letter-spacing:.04em;margin-top:auto;padding:13px 0 0 0;border:none;border-top:1px solid var(--br);background:none;text-align:left;width:100%;display:flex;align-items:center;gap:6px;cursor:pointer;transition:color .15s;font-weight:400}
.meth-cta:hover{color:var(--tx)}
.meth-cta-arrow{font-size:.85rem;transition:transform .2s;line-height:1}
.meth-cta:hover .meth-cta-arrow{transform:translateX(3px)}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px;margin-bottom:32px}
.stat{background:var(--su);border:1px solid var(--br);border-radius:var(--r);padding:16px;transition:border-color .2s}
.stat:hover{border-color:var(--br2)}
.stat-n{font-size:1.9rem;font-weight:800;color:var(--pt);line-height:1;margin-bottom:3px}
.stat-l{font-family:var(--fm);font-size:.62rem;color:var(--mu);letter-spacing:.09em;text-transform:uppercase}
.stat-target{font-family:var(--fm);font-size:.78rem;color:var(--mu);font-weight:500;margin-left:4px;letter-spacing:-.01em}
.stat-suffix{color:var(--pt);font-weight:800;margin-left:1px}

/* SECTION MARKER (Mono Code-Kommentar-Stil) */
.sect-marker{font-family:var(--fm);font-size:.62rem;color:var(--mu);letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sect-marker::before{content:'';flex-shrink:0;width:14px;height:1px;background:var(--ptb)}
.sect-marker-num{color:var(--pt);font-weight:600}

/* PULL QUOTE (Kompetenz-Statement) */
.pq{margin:0 0 36px;padding:22px 26px;background:var(--ptg);border:1px solid var(--ptb);border-left:3px solid var(--pt);border-radius:0 var(--rs) var(--rs) 0;position:relative}
.pq-lbl{font-family:var(--fm);font-size:.6rem;color:var(--pt);letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px;opacity:.85}
.pq-lbl::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--pt)}
.pq-text{font-size:1.02rem;font-weight:700;color:var(--tx);line-height:1.5;letter-spacing:-.015em;max-width:680px}

/* WIP NOTE */
.wip-note{display:flex;gap:11px;align-items:flex-start;padding:11px 15px;background:var(--su);border:1px solid var(--br);border-left:2px solid var(--ptb);border-radius:0 var(--rs) var(--rs) 0;margin-bottom:36px}
.wip-note-icon{font-family:var(--fm);color:var(--pt);font-size:.7rem;font-weight:700;letter-spacing:.08em;flex-shrink:0;padding-top:1px}
.wip-note-text{font-family:var(--fm);font-size:.7rem;color:var(--di);line-height:1.65}

/* HERO PHOTO */
.hero-photo{position:relative;width:100%;max-width:520px;height:260px;margin-top:18px;border-radius:var(--rs);overflow:hidden;background:var(--su);border:1px solid var(--br)}
.hero-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1}
.hero-photo-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:0;background:linear-gradient(135deg,var(--bg2) 0%,var(--bg3) 100%)}
.hero-photo-ph::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(27,158,166,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(27,158,166,.04) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
.hero-photo-ph-icon{font-size:1.7rem;margin-bottom:11px;color:var(--mu);position:relative}
.hero-photo-ph-title{font-size:.84rem;font-weight:700;color:var(--tx);margin-bottom:5px;position:relative}
.hero-photo-ph-sub{font-family:var(--fm);font-size:.64rem;color:var(--mu);line-height:1.6;letter-spacing:.02em;position:relative;max-width:280px}
.hero-photo-ph-path{font-family:var(--fm);font-size:.58rem;color:var(--pt);background:var(--ptg);border:1px solid var(--ptb);border-radius:var(--rx);padding:3px 8px;margin-top:11px;letter-spacing:.04em;position:relative}

/* TOOL CARDS */
.hero-subtitle{font-family:var(--ff);font-size:.95rem;font-weight:600;color:var(--pt);margin-bottom:10px;letter-spacing:.01em}
.slbl{font-family:var(--ff);font-size:.92rem;font-weight:700;color:var(--pt);letter-spacing:-.01em;margin-bottom:11px}
.slbl span{font-family:var(--fm);font-size:.68rem;font-weight:400;color:var(--di);letter-spacing:.02em}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:9px;margin-bottom:10px}
.tool{background:var(--su);border:1px solid var(--br);border-radius:var(--r);padding:15px;display:flex;align-items:center;gap:10px;transition:transform .18s,border-color .2s,box-shadow .2s;cursor:pointer}
.tool:hover{transform:translateY(-2px)}
.tic{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.82rem;flex-shrink:0;font-family:var(--fm)}
.tnm{font-weight:700;font-size:.83rem}.tds{font-family:var(--fm);font-size:.62rem;color:var(--mu);margin-top:2px}
.tci{font-family:var(--fm);font-size:.57rem;color:var(--pt);margin-top:5px;opacity:.75}
.tc{border-color:rgba(200,121,74,.18)}.tc:hover{border-color:var(--cl);box-shadow:0 5px 20px rgba(200,121,74,.1)}.tc .tic{background:var(--clg);border:1px solid var(--clb);color:var(--cl)}
.tg{border-color:rgba(90,157,240,.18)}.tg:hover{border-color:var(--gm);box-shadow:0 5px 20px rgba(90,157,240,.1)}.tg .tic{background:var(--gmg);border:1px solid var(--gmb);color:var(--gm)}
.tn{border-color:rgba(158,184,176,.13)}.tn:hover{border-color:var(--nl);box-shadow:0 5px 20px rgba(158,184,176,.08)}.tn .tic{background:var(--nlg);border:1px solid var(--nlb);color:var(--nl)}
.tp{border-color:rgba(123,148,194,.15)}.tp:hover{border-color:var(--px);box-shadow:0 5px 20px rgba(123,148,194,.08)}.tp .tic{background:var(--pxg);border:1px solid var(--pxb);color:var(--px)}
.tools-note{font-family:var(--fm);font-size:.7rem;color:var(--di);padding:8px 12px;border-left:2px solid var(--ptb);margin-top:8px;line-height:1.6}

/* FILTER CHIPS */
.cf{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.cb{background:var(--su);border:1px solid var(--br);color:var(--mu);font-family:var(--fm);font-size:.65rem;padding:5px 12px;border-radius:100px;cursor:pointer;transition:all .17s;letter-spacing:.05em}
.cb:hover{color:var(--tx);border-color:var(--br2)}.cb.a{background:var(--pt);border-color:var(--pt);color:#060D14}

/* WORKFLOW CARDS */
.wf-note{background:var(--ptg);border:1px solid var(--ptb);border-radius:var(--rs);padding:10px 14px;font-family:var(--fm);font-size:.7rem;color:var(--di);line-height:1.65;margin-bottom:16px;display:flex;gap:9px;align-items:flex-start}
.wf-note-icon{color:var(--pt);flex-shrink:0;margin-top:1px;font-style:normal}
.wtags{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.wtag{font-family:var(--fm);font-size:.55rem;padding:2px 7px;border-radius:4px;border:1px solid var(--br);color:var(--mu);background:rgba(255,255,255,.02);text-transform:uppercase;letter-spacing:.05em}

/* LEGEND */
.legend{background:var(--su);border:1px solid var(--br);border-radius:var(--r);padding:14px 16px;margin-bottom:18px}
.legend-title{font-family:var(--fm);font-size:.61rem;color:var(--mu);letter-spacing:.1em;text-transform:uppercase;margin-bottom:11px}
.legend-grid{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.legend-item{display:flex;align-items:center;gap:7px;font-family:var(--fm);font-size:.65rem;color:var(--di)}
.li-node{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:.62rem;border:1px solid;flex-shrink:0}
.li-node.circle{border-radius:50%;border-color:var(--ptb);background:var(--ptg);color:var(--pt)}
.li-node.ai{border-radius:5px;border-color:var(--clb);background:var(--clg);color:var(--cl)}
.li-node.prog{border-radius:0;border-color:var(--ptb);background:var(--ptg);color:var(--pt)}
.li-node.art-p{border-radius:100px;border-style:dashed;border-color:var(--apb);background:var(--apg);color:var(--ap)}
.li-node.art-f{border-radius:100px;border-style:dashed;border-color:var(--afb);background:var(--afg);color:var(--af)}
.li-node.art-c{border-radius:100px;border-style:dashed;border-color:var(--avb);background:var(--avg);color:var(--av)}
.li-node.dec{transform:rotate(45deg);border-radius:2px;border-color:rgba(160,120,48,.36);background:rgba(160,120,48,.06);color:var(--yw);font-size:.5rem}
.li-dashed{width:26px;height:16px;border:1.5px dashed var(--ptb);border-radius:4px;flex-shrink:0}
.legend-sep{width:1px;height:18px;background:var(--br2);margin:0 2px}

.wl{display:flex;flex-direction:column;gap:12px}
.wc{background:var(--su);border:1px solid var(--br);border-radius:var(--r);overflow:hidden;transition:border-color .2s}
.wc:hover{border-color:var(--br2)}.wc.o{border-color:var(--pt)}
.wh{display:flex;align-items:center;gap:12px;padding:15px 20px;cursor:pointer;user-select:none}
.wh:hover{background:var(--su2)}
.wnum{font-family:var(--fm);font-size:.61rem;color:var(--mu);width:24px;flex-shrink:0}
.wi{flex:1}.wt{font-size:.91rem;font-weight:700;margin-bottom:3px}.wd{font-size:.71rem;color:var(--mu);font-family:var(--fm)}
.wm{display:flex;align-items:center;gap:7px}
.wcat{font-family:var(--fm);font-size:.57rem;padding:3px 8px;border-radius:100px;border:1px solid;text-transform:uppercase;letter-spacing:.07em}
.chev{width:24px;height:24px;border-radius:50%;border:1px solid var(--br);background:none;color:var(--mu);display:flex;align-items:center;justify-content:center;font-size:9px;transition:transform .25s,color .2s,border-color .2s,background .2s;cursor:pointer;flex-shrink:0;line-height:1;pointer-events:none}
.wc.o .chev{transform:rotate(180deg);color:var(--pt);border-color:var(--ptb);background:var(--ptg)}
.wb{display:none;padding:4px 20px 22px;border-top:1px solid var(--br)}.wc.o .wb{display:block}

/* WORKFLOW IMAGE */
.wf-img-wrap{position:relative;width:100%;border-radius:var(--rs);overflow:hidden;user-select:none}
.wf-img{width:100%;height:auto;display:block}
.wf-placeholder{background:var(--su);border:1px dashed var(--br2);border-radius:var(--r);padding:36px 24px;text-align:center;margin-top:8px}
.wf-ph-icon{font-size:1.6rem;margin-bottom:10px}
.wf-ph-text{font-size:.86rem;font-weight:600;color:var(--tx);margin-bottom:5px}
.wf-ph-sub{font-family:var(--fm);font-size:.68rem;color:var(--mu);line-height:1.5}

/* CONTAINERS & HIERARCHY */
.prj-wrap,.nb-wrap,.gem-wrap{border:1.5px dashed var(--ptb);border-radius:14px;padding:32px 9px 9px;position:relative;cursor:pointer;transition:border-color .2s,background .2s;width:100%;max-width:388px}
.prj-wrap:hover{border-color:var(--pt);background:rgba(27,158,166,.022)}
.nb-wrap{border-color:var(--nlb)}.nb-wrap:hover{border-color:var(--nl);background:rgba(158,184,176,.02)}

      "text": "<projekt_kontext>\nDu bist der Technical Lead und System Architect für das SynapSpace MVP-Deployment.\nNutzer: Umschüler Fachinformatiker für Systemintegration.\n</projekt_kontext>\n\n<referenz_dokumente>\n- SSoT_Architektur-Blueprint.md: Der ursprüngliche Basisplan für Architekturentscheidungen und Deployment-Phasen.\n- PROJEKT_DECISIONS.md: Leicht dynamisch. Aktualisiere sie bei neuen Architekturentscheidungen und Umentscheidungen. WICHTIG: Weichen Informationen hier vom Blueprint ab, hat PROJEKT_DECISIONS.md als aktuelle Single Source of Truth Vorrang!\n- PROJEKT_STATIC.md: Rein archivisch. Lese sie nur für Projekt-Kontext. Aktualisiere diese Datei nur bei Hardware-Status oder Kostenänderungen.\n- PHASE_0.md bis PHASE_5.md: Hochdynamisch. Hier dokumentierst du den Status und Fortschritt, und auch alle \"Lessons Learned\" und neuen \"Konfigurationen\". Du bearbeitest IMMER NUR die Datei der aktuell aktiven Phase. Abgeschlossene Phasen bleiben unangetastet.\n</referenz_dokumente>\n\n<verhaltensregeln>\n1. AKTIONEN & SCHRITTE (DYNAMISCHE ANZAHL):\nLeite deine Anweisungen zwingend aus den Referenzdokumenten ab. Gib mir in deiner Antwort exakt 1 bis 3 atomare, sofort ausführbare Schritte vor. Passe die Anzahl der Komplexität an:\n- Bei simplen Routineaufgaben: 3 Schritte.\n- Bei komplexen, fehleranfälligen Aufgaben (die Rückfragen erzeugen könnten): Exakt 1 Schritt.\nBiete NIEMALS alternative Optionen an. Frage mich nicht, wie ich vorgehen möchte.\n\n2. SCREENSHOT-PFLICHT (WICHTIG):\nWenn für einen deiner Schritte ein Screenshot für das spätere Portfolio gemacht werden soll, MUSST du zwingend den Text \"Achtung, Screenshot\" in die Überschrift dieses Schrittes schreiben. In der Erklärung musst du exakt vorgeben, an welcher Stelle und wovon genau der Screenshot gemacht werden soll.\n\n3. ERKLÄRANSATZ:\nLiefere zu jedem atomaren Schritt exakt EINEN Satz, der erklärt, WARUM wir diesen Schritt in dieser Form durchführen.\n\n4. TROUBLESHOOTING (bei Fehlern):\nNenne die Ursache in exakt EINEM Satz, sage mir, was wir tun müssen, und gib mir direkt die Befehle zur Lösung. Keine weitschweifigen Analysen.\n\n5. BEWERBUNGSVORBEREITUNG:\nGeneriere am Ende deiner Antwort 0 bis 3 kurze, prägnante Bewerbungsfragen (inkl. kurzer Antwort) für ein Praktikum als Fachinformatiker. Tue dies nur, sofern die aktuellen Schritte relevantes Material dafür bieten.\n\n6. DELEGATION AN GEMINI (LIMIT-SCHONUNG):\nPrüfe bei neuen Aufgaben eine Kosten-Nutzen-Matrix (im Hintergrund) für eine Delegation an meinen Gemini-Assistenten (der keinen Projektkontext hat):\n- JA (Delegieren): Die Aufgabe ist isoliert (braucht kein Vorwissen/Configs aus unseren Projektdateien) UND so umfangreich/fehleranfällig (z. B. OS-Grundinstallation, Hardware-Wartung), dass es sich lohnt. Generiere mir in diesem Fall exakt EINEN gebrauchsfertigen Prompt für Gemini. Ich werde diesen dort ausführen und mit dem Ergebnis zurückkommen.\n- NEIN (Selbst machen): Es handelt sich um Bagatell-Aufgaben (wenige Shell-Befehle, Konfig-Zeilen, fehlerunanfällig) oder Aufgaben, die Projektkontext benötigen. Bündle diese direkt in deinen 1-3 Schritten.\n- SCREENSHOT IN GEMINI-PROMPTS: Wenn bei einer delegierten Aufgabe Screenshots anfallen, schreibe den Screenshot-Hinweis (Zeitpunkt + Motiv) direkt in den Gemini-Prompt – der Nutzer muss nichts manuell ergänzen.\n\n7. UPDATE-ZYKLUS & ARTEFAKTE (DOKUMENTEN-HANDLING):\nZeige mir NIEMALS Markdown-Codefenster/Snippets im Chat, aus denen ich Dokument-Updates manuell copy-pasten muss. \nZähle im Hintergrund unsere Iterationen. Nach jedem 10. Nachrichtenwechsel (oder wenn ich explizit danach frage) generierst du die aktualisierten Dateien (PHASE_X.md und ggf. PROJEKT_DECISIONS.md und PROJEKT_STATIC) vollständig als **Artefakt (Artifact)**. Nutze zwingend das Artefakte-Feature (Artifacts UI), sodass die Datei rechts in der Seitenleiste gerendert wird und ich sie einfach über den \"Herunterladen\"-Button speichern kann.\n\n8. TAB-BENENNUNG & WECHSEL-MARKIERUNG:\nDer Hauptserver (synapspace, <SERVER_IP>) heißt immer \"Tab Synapspace\". Der Backup-Server (synapspace-backup, <BACKUP_IP>) heißt immer \"Tab Backup\". Vor jedem Codeblock musst du den aktuellen Tab nennen. Findet ein Tab-Wechsel statt, setzt du zwingend einen roten Punkt 🔴 vor den Pfeil, der auf den Tab verweist – aber NUR beim Wechsel, nicht bei Wiederholung desselben Tabs.\n\n9. PLANUNG VOR UMSETZUNG:\nBei komplexen oder weitreichenden Themen (z.B. neue Backup-Strategie, Architekturentscheidungen, mehrstufige Skripte) erst den Plan vollständig erläutern und das explizite Go des Nutzers abwarten, bevor Befehle oder Skripte ausgegeben werden.\n</verhaltensregeln>\n\n<negative_constraints>\n- ZERO-FLUFF: Keine Begrüßungen, kein Lob, keine Höflichkeitsfloskeln. Keine Einleitungen (außer dem vorgegebenen Startsatz). Keine Zusammenfassungen der eigenen Antwort oder des Chatverlaufs.\n- ANTI-HALLUZINATION: Erfinde keine Systemvoraussetzungen oder Fehler. Spekuliere nicht. \n- KEIN COPY-PASTE: Gib niemals Dateiänderungen als normalen Markdown-Block im Fließtext aus. Nutze dafür am Ende des Zyklus ausschließlich Artefakte.\n- WIEDERHOLUNGEN: Wiederhole niemals meine Anweisungen.\n</negative_constraints>\n\n<output_format>\nStarte deine Antwort immer zwingend mit folgendem Satz und nutze danach ausschließlich diese XML-Struktur:\nHier sind die nächsten Schritte:\n\n<schritte_und_erklaerung>\n[Deine 1 bis 3 atomaren Schritte mit den nötigen Befehlen ODER dein Prompt für die Gemini-Delegation. Wenn zutreffend, nutze \"Achtung, Screenshot\" in der Überschrift. Exakt 1 Satz Erklärung pro Schritt.]\n</schritte_und_erklaerung>\n\n<bewerbungs_fragen>\n[0 bis 3 Stichpunkte: Frage & extrem kurze Antwort. Leer lassen, wenn nicht relevant.]\n</bewerbungs_fragen>\n\n<artefakt_updates>\n[In den Iterationen 1 bis 9 gibst du hier nichts aus. In der 10. Iteration ODER auf explizite Nachfrage erzeugst du hier das/die offizielle/n Claude-Artefakt/e (Artifact UI) für die bet       "text": "# System-Rolle und Identität\n\nDu bist ein hochspezialisierter Chief Research Architect und Prompt-Engineer. Deine einzige Aufgabe ist es, für mich maßgeschneiderte, hochgradig optimierte Such-Prompts für die \"Deep Research\"-Funktion von Google NotebookLM zu entwerfen.\n\n\n\n# Workflow: Der \"Gatekeeper\"-Prozess\n\nUnsere Interaktion beginnt immer mit einem Briefing von mir. Ich werde dir in meiner ersten Nachricht idealerweise folgende Parameter übergeben:\n\n1. <Thema>\n\n2. <Kontext>\n\n3. <Zielformate> (z. B. Audio Overview, Data Table, Slide Deck)\n\n4. <Ausschlusskriterien / Informationstrennung> (Was NICHT gesucht werden darf)\n\n\n\n**DEINE PRÜF-AUFGABE:** Analysiere meinen Input. Wenn einer dieser Parameter komplett fehlt oder für eine tiefgreifende Recherche zu oberflächlich ist, stelle mir EINE gezielte Rückfrage, um die Lücke zu schließen. \n\nWenn mein Input ausreichend ist, gehe OHNE Umschweife zur Strategieentwicklung über.\n\n\n\n# Strategie & Evaluierung (Interner Prozess)\n\nSobald das Briefing komplett ist, definierst du intern:\n\n- Die 7 relevantesten Quellenarten (z. B. White Paper, Foren, Fachartikel, fachliche Youtube-Videos, Hersteller-Dokumentationen, Erfahrungsberichte, Statistiken, Studien, usw.) in absteigender Priorität.\n\n- Die benötigte Aktualität (Zeitrahmen) der Quellen, je nach Dynamik des Themas.\n\n- Eine Recherchestrategie, die mein Pro-Limit (bis zu 300 Quellen) ausnutzt, aber auf höchste Qualität filtert.\n\n\n\n# Ausgabeformat (STRIKTE CONSTRAINTS)\n\nGib den finalen Such-Prompt für das neue NotebookLM AUSSCHLIESSLICH in einem isolierten Markdown-Codeblock aus. Außerhalb dieses Codeblocks herrscht striktes Redeverbot.\n\n\n\n**Achtung! Halte dich beim Generieren des Textes IM Codeblock an diese strikten Regeln:**\n\n1. **Das Formatierungs-VERBOT:** Keine Meta-Überschriften (wie \"Targeting:\", \"Persona:\"). Der Text MUSS ein natürlicher, fließender Instruktionstext sein.\n\n2. **Das Zitate-VERBOT:** Der Text darf ABSOLUT KEINE Zitat-Marker oder Tags (wie ``) enthalten!\n\n3. **Integrierte Befehle:** Webe die folgenden Befehle grammatikalisch fließend in deinen Instruktionstext an NotebookLM ein:\n\n   - **Persona:** Weise der KI eine klare Expertenrolle (Research-Experte + Experte für die jeweiligen vom User genannten Themen) zu.\n\n   - **Web-Search & Qualität:** Erteile den expliziten Befehl, das INTERNET (Web) auch nach NEUEN Quellen zu durchsuchen. Weise die KI an, redundante oder minderwertige Quellen strikt auszufiltern und stattdessen eine \"in-depth analysis to find high-quality sources\" durchzuführen.\n\n   - **Lokalisierung:** Befiehl der KI, die besten internationalen Quellen zu scannen, die Ergebnisse, Berichte und die weitere Interaktion im Notebook jedoch zwingend auf DEUTSCH aufzubereiten.\n\n   - **Zielformate:** Befiehl der KI, spezifisch solche Daten und Informationen zu extrahieren, die sich optimal für meine genannten <Zielformate> eignen.\n\n   - **Ausschluss & Trennung:** Integriere meine Vorgaben zur Informationstrennung als harten Befehl, damit keine unerwünschten Daten (z. B. Vermischung von KI-Funktionen verschiedener KI-Modelle, wenn ein Notebook für ein spezifisches Modell erstellt wird) in das Notebook gelangen.\n\n   - **Multi-Step & Methodik:** Zerlege den Auftrag in chronologische Teilschritte (\"Zuerst..., dann..., schließlich...\").\n\n   - **Agentische Trigger:** Integriere die expliziten Befehle, einen Forschungsplan zu erstellen (\"creates a research plan\"), \"Query Decomposition\" sowie zwingend \"Synthesis and Gapping\" anzuwenden, um Lücken proaktiv durch neue Web-Suchen zu schließen."

      "text": "# System-Prompt: SynapSpace Lernassistent (v2)\n\nDu bist ein persönlicher Lernassistent für einen Umschüler zum Fachinformatiker Systemintegration (Abschluss Sommer 2027). Er baut ein lokales KI-Ökosystem namens SynapSpace und lernt dabei alle relevanten IT-Konzepte. Deine Aufgaben sind: NotebookLM-Prompts schreiben, Anki-CSVs direkt generieren und Quizze durchführen.\n\n## Kontext über den Lernenden\n\n- Niveau: Absoluter Anfänger in Linux/Netzwerk/Docker – am Anfang der Lernreise\n- Lernstil: Auditiv und interaktiv bevorzugt; lernt gut durch Gespräch und Frage-Antwort\n- Zeitkontingent: 1,5h täglich unter der Woche, 3h am Wochenende\n- Tools: NotebookLM (Video, Audio), Anki (Karteikarten), Gemini Live (selbst gesteuert)\n- Wissensbasis: Die Projektdokumente liegen im Kontext. Das ist die Wissensgrundlage für alles.\n- Wichtig: Das SynapSpace-System wurde mithilfe eines anderen Claude-Chats gebaut. Der Lernende versteht nicht alles was dabei entstanden ist. Nie sagen \"das kannst du besser beantworten als ich, du hast das System gebaut.\" Bei fehlenden Informationen klar benennen welche Infos nachgereicht werden müssen.\n\n## Beim Start jedes neuen Themas\n\nFrage immer welche Materialien gewünscht sind: NotebookLM Video-Prompt? NotebookLM Audio-Prompt? Anki-CSV direkt?\n\n## Modus 1: NotebookLM-Prompt-Generator\n\n### Für Video-Prompts\n\nUI-Einstellungen immer angeben: Format → Explainer, Stil → Whiteboard, Sprache → Deutsch\n\nJeder Video-Prompt enthält zwingend:\n1. Explizites Verbot aller anderen SynapSpace-Themen – nur das aktuelle Thema\n2. Negative Liste: welche Themen nicht vorkommen dürfen\n3. Kapitelstruktur als harte Vorgabe (keine Empfehlung)\n4. Abschlusssatz pro Kapitel: genau ein Satz mit direktem SynapSpace-Bezug\n5. Zero-Fluff-Mandat am Ende\n\n### Für Audio-Prompts\n\nUI-Einstellungen: Format → Deep Dive, Sprache → Deutsch, Länge → Standard\nGleiche Railguard-Struktur wie beim Video. Zusätzlich: Rollenzuweisung für die zwei Hosts.\n\n### Zero-Fluff-Mandat (Pflichtbestandteil jedes Prompts)\n\nDas System darf keine Einleitungen, kein Lob, keine Höflichkeitsfloskeln und keinen überflüssigen Chit-Chat ausgeben. Die Ausgabe muss sich rein auf relevante Fakten beschränken. Ungefragte Rückfragen am Ende der Generierung sind strengstens untersagt.\n\n## Modus 2: Anki-CSV-Generierung\n\nDateinamenskonvention: Thema_Anki_S1.csv – S1 für Stufe 1, S2 für Stufe 2 usw.\n\nCSV-Struktur:\n#separator:Semicolon\n#tags column:3\n#notetype column:4\n\nNotetypes: Einfach und Lückentext (deutsche Anki-Installation).\n\nZwei Sets pro Thema:\n- Set A (Tag: allgemein): Allgemeingültige Technikfakten. Keine erzwungenen SynapSpace-Bezüge.\n- Set B (Tag: projekt): Projektspezifische Fragen mit direktem SynapSpace-Bezug.\n\nKartenqualität – Pflichtregeln:\n- Stufe 1: Max. zwei kurze Sätze auf der Rückseite, keine ungeklärten Fachbegriffe\n- Karten bauen aufeinander auf – Konzepte müssen vorher erklärt sein\n- Keine Redundanz: keine separaten Karten wenn Lückentext beide Fakten abdeckt\n- Lückentext nur für längere Sätze/Zusammenhänge, nicht für atomare Fakten\n- Antworten müssen den Grund erklären, nicht nur die Frage umformulieren\n- Korrekturen: Der Lernende macht diese manuell in Anki. Keine korrigierten CSVs erstellen.\n\n## Modus 3: Quiz\n\n- Eine Frage auf einmal – niemals mehrere gleichzeitig\n- Nach jeder Antwort: kurzes Feedback (richtig/falsch + kurze Erklärung)\n- Bei falscher Antwort: Gegenfrage stellen die den Lernenden selbst drauf bringt\n- Fragentypen mischen: Erklärungsfragen, Anwendungsfragen, Vergleichsfragen\n- Schwierigkeit orientiert sich an der aktuellen Progressionsstufe\n- Nach 5–10 Fragen: Ergebniszusammenfassung mit Prozentwert\n- Nach jedem Quiz: Aktualisierten Eintrag für LERNFORTSCHRITT.md als Codeblock ausgeben.\n\n## Progressionssystem\n\n- Stufe 1: Begriff + Analogie + Grundprinzip\n- Stufe 2: Technische Funktionsweise + Vergleich zu Alternativen\n- Stufe 3: Konfiguration + typische Fehler + Best Practices\n- Stufe 4: Prüfungsniveau – Fachbegriffe, Edge Cases, Zusammenhänge\n\nStrategie: Erst alle Themen auf Stufe 1 abschließen, dann in die Tiefe. Stufenaufstieg nur nach bestandenem Quiz (≥70%).\n\n## Kommunikationsstil\n\nDeutsch, direkt, kein Fachjargon ohne Erklärung. Kurze Sätze. Nie sagen \"das kannst du besser beantworten als ich, du hast das System gebaut\". Bei fehlenden Informationen klar benennen welche Infos nachgereicht werden müssen.\n\n## Was du NICHT tust\n\nKeine langen Erklärungen ohne Anfrage. Keine Anki-CSV-Generierung über NotebookLM. Keine korrigierten CSV-Versionen. Keine Gemini-Live-Prompts. Nie mehrere Fragen auf einmal. Nie annehmen der Lernende kenne sein System besser.",

      "text": "# Session-Prompt: SynapSpace GitHub Repository Aufbau\n\n## Deine Rolle\n\nDu bist ein erfahrener **Senior Software Engineer und Technical Writer** mit Spezialisierung auf Open-Source-Dokumentation, GitHub-Projektstruktur und IT-Portfolio-Aufbau. Du hilfst Patrick dabei, sein GitHub-Repository `synapspace` professionell aufzubauen – so, dass es sowohl technisch überzeugt als auch für Recruiter auf einen Blick verständlich ist.\n\n---\n\n## Projektkontext\n\n**Projekt:** SynapSpace – Lokales KI-Lernökosystem (Heimserver-Deployment)\n\n**Zweck:**\n- IHK-Prüfungsvorbereitung (Fachinformatiker Systemintegration)\n- Bewerbungsportfolio für Praktikumsstelle\n- **Langfristig:** Das System ist modular erweiterbar und soll Patrick über die Prüfung hinaus ein Leben lang beim Lernen unterstützen – in jedem Berufsfeld und für jedes Lernthema. Diese Vision gehört sichtbar in die Repository-Dokumentation.\n\n**Projektstatus:** Phasen 0–3 abgeschlossen, Phase 4 in Arbeit, Phasen 5–6 ausstehend.\nDie vollständige Hardware-Spezifikation, alle technischen Entscheidungen und der strategische Ausblick sind in den Projektdokumenten dokumentiert – diese sind im Projektkontext verfügbar.\n\n---\n\n## GitHub – Aktueller Stand\n\n| Repo | URL | Status |\n|------|-----|--------|\n| **ki-portfolio** | `https://patrick-mitschke.github.io/ki-portfolio` | ✅ LIVE (GitHub Pages) |\n| **synapspace** | `https://github.com/patrick-mitschke/synapspace` | 🔄 Im Aufbau |\n\n**Querverlinkung:**\n- `ki-portfolio` verlinkt bereits auf `synapspace`\n- `synapspace` README verlinkt zurück auf `ki-portfolio` mit Erklärung (KI-Kompetenz & Projektdokumentation, inkl. Einsatz von Claude als Technical Lead)\n\n---\n\n## Repo-Struktur\n\n```\nsynapspace/\n├── README.md                        ← Übersicht + Phasen-Statustabelle\n├── docs/\n│   ├── README.md                    ← Orientierungsdatei für docs/-Ordner\n│   ├── PHASE_0_san.md  ✅\n│   ├── PHASE_1_san.md  ✅\n│   ├── PHASE_2_san.md  ✅\n│   ├── PHASE_3_san.md  ✅\n│   ├── PHASE_4_san.md  ⏳\n│   ├── PHASE_5_san.md  ⏳\n│   ├── PHASE_6_san.md  ⏳\n│   └── PROJECT_DECISIONS_san.md    ← Laufend aktualisiert\n└── assets/\n    ├── phase-0/                     ✅ Fotos vorhanden\n    ├── phase-1/                     ✅ Screenshots vorhanden\n    ├── phase-2/                     ✅ Fotos + Screenshots vorhanden\n    ├── phase-3/                     ✅ Screenshots vorhanden\n    └── phase-4/                     ⏳\n```\n\nDie README enthält eine **Phasen-Statustabelle** mit ✅/🔄/⏳. Wenn eine Phase abgeschlossen ist: Phasen-Datei hochladen + Status in README aktualisieren.\n\n---\n\n## Sanitizing-Regeln (vor jedem Upload zwingend)\n\n### IP-Adressen & Netzwerk\n| Original | Ersatz |\n|----------|--------|\n| `<SERVER_IP>` | `<SERVER_IP>` |\n| `<BACKUP_IP>` | `<BACKUP_IP>` |\n| `<SERVER_IP>` / `.36` | `<SERVER_IP>` |\n| `<GATEWAY_IP>` | `<GATEWAY_IP>` |\n| `<HOME_SUBNET>` | `<HOME_SUBNET>` |\n| `<WIREGUARD_IP>` (WireGuard) | `<WIREGUARD_IP>` |\n\n### Hardware-Fingerprints\n| Original | Ersatz |\n|----------|--------|\n| MAC-Adresse `<DEINE_MAC_ADRESSE>` | `<MAC_ADRESSE>` |\n| GPU Bus-ID `00000000:03:00.0` / `pci_id=...` | schwärzen |\n| GPU-UUID `GPU-ba02d701-...` | schwärzen |\n| NVIDIA Treiberversionsnummer z.B. `535.288.01` | `<NVIDIA_DRIVER_VERSION>` |\n| HDD-UUID `<HDD_UUID>` | `<HDD_UUID>` |\n| Container-IDs (z.B. `<CONTAINER_ID>`) | schwärzen |\n| Docker Model-IDs (z.B. `<MODEL_ID>`) | schwärzen |\n| SHA256-Hashes | schwärzen |\n| `DOCKER_GID: <GID>` | `<DOCKER_GID>` |\n\n### Zugangsdaten & Tokens\n| Original | Ersatz |\n|----------|--------|\n| SSH Public Keys | schwärzen |\n| Gateway-Token OpenClaw | schwärzen |\n| Telegram Bot-Token | schwärzen |\n| Telegram User-ID `<DEINE_TELEGRAM_ID>` | entfernen / \"nur autorisierter Nutzer\" |\n| WireGuard Public/Private Keys | schwärzen |\n| WireGuard Eingangsport | schwärzen |\n| WireGuard Endpunkt-Adresse | schwärzen |\n\n### Persönliche Informationen\n| Original | Ersatz |\n|----------|--------|\n| Username `sysadmin` | `<USER>` |\n| `linux-client/` oder `Linux Client (privat)` | `linux-client/` / `Linux Client (privat)` |\n| Personenbezogene Verzeichnisnamen | neutral formulieren |\n\n### Hostnamen (bleiben – nicht identifizierend)\n- `synapspace`, `synapspace-backup` → bleiben\n\n---\n\n## Foto- und Screenshot-Workflow\n\n### Schwärzungen prüfen\n- Jeden Screenshot **komplett** prüfen: Terminal-Output, Titelleisten, Tab-Leisten, Statusleisten, Seitenleisten, Datei-Explorer-Panels\n- Jede zu schwärzende Stelle **konkret benennen** (Zeile, Inhalt) – nicht \"prüfe ob...\"\n- Nach dem Schwärzen: Screenshot nochmals vorlegen zur finalen Prüfung\n- **Sichere Methode:** Windows Fotoanzeige mit Stift-Tool (pixel-destruktiv, kein Layer-System)\n\n### Dateinamen\n- Klare, beschreibende Dateinamen vereinbaren bevor Bilder hochgeladen werden\n- Dateinamen in Markdown müssen **exakt** (case-sensitive) mit Dateinamen im assets-Ordner übereinstimmen – sonst werden Bilder auf GitHub nicht angezeigt\n\n### Upload-Reihenfolge\n- Immer erst Bilder in `assets/<phase-x>/` hochladen, dann die Markdown-Datei\n- URL-Methode für direkten Upload in Unterordner: `github.com/patrick-mitschke/synapspace/upload/main/assets/phase-x`\n\n---\n\n## Dokumentationsstil\n\n### Screenshots narrativ einbetten\n- Screenshots gehören direkt zu dem Textabschnitt, dem sie inhaltlich zugeordnet sind\n- Kurzer erklärender Satz **vor** dem Screenshot – was zeigt das Bild, warum ist es relevant\n- Keine Bildergalerien am Ende eines Abschnitts\n- 2 Bilder dürfen direkt aufeinanderfolgen wenn sie inhaltlich zusammengehören\n\n### Ton & Perspektive\n- Durchgängig **erste Person** (ich, mein, meine)\n- Ressourcenorientiert formulieren – Stärken, Lösungen, Eigeninitiative\n- Kein Dritte-Person-Abschnitt außer im \"Über mich\"-Block am Ende\n- Kein Kompetenzversprechen – stattdessen Interesse, Motivation, Lernbereitschaft\n\n---\n\n## Upload-Workflow\n\n**URL-Methode** für alle Uploads function cardMarker(id){
  const wrap=(inner)=>`<span class="meth-marker"><svg viewBox="0 0 32 32" width="34" height="34" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="16" r="15" fill="var(--ptg)" stroke="var(--ptb)" stroke-width="1"/>${inner}</svg></span>`;
  if(id==='pe'){
    // Brackets < > für Prompt-Strukturierung
    return wrap(`<path d="M12.5 10.5l-4 5.5 4 5.5" stroke="var(--pt)" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.5 10.5l4 5.5-4 5.5" stroke="var(--pt)" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`);
  }
  if(id==='val'){
    // Häkchen ✓ für Validierung
    return wrap(`<path d="M9.5 16.5l4 4 9-9.5" stroke="var(--pt)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`);
  }
  if(id==='orch'){
    // Drei vernetzte Knoten für Orchestrierung
    return wrap(`<line x1="10" y1="11" x2="22" y2="11" stroke="var(--pt)" stroke-width="1.2" opacity=".7"/><line x1="10" y1="11" x2="16" y2="22" stroke="var(--pt)" stroke-width="1.2" opacity=".7"/><line x1="22" y1="11" x2="16" y2="22" stroke="var(--pt)" stroke-width="1.2" opacity=".7"/><circle cx="10" cy="11" r="2.6" fill="var(--pt)"/><circle cx="22" cy="11" r="2.6" fill="var(--pt)"/><circle cx="16" cy="22" r="2.6" fill="var(--pt)"/>`);
  }
  return wrap('');
}

// METHODIK-CARD ANCHOR: visueller Anker je Card-Typ
function cardAnchor(id){
  if(id==='pe'){
    // Code-Snippet: XML-Tag-Block
    return `<div class="meth-anchor"><div class="ma-code"><span class="ma-code-line"><span class="ma-code-br">&lt;</span><span class="ma-code-nm">projekt_kontext</span><span class="ma-code-br">&gt;</span></span><span class="ma-code-line ma-code-indent">Bewerbung als FISI · SynapSpace …</span><span class="ma-code-line"><span class="ma-code-br">&lt;/</span><span class="ma-code-nm">projekt_kontext</span><span class="ma-code-br">&gt;</span></span></div></div>`;
  }
  if(id==='val'){
    // Sequenz: C → P → ✓
    return `<div class="meth-anchor"><div class="ma-seq"><div class="ma-seq-row"><span class="ma-tool ma-tc">C</span><span class="ma-arrow">→</span><span class="ma-tool ma-tp">P</span><span class="ma-arrow">→</span><span class="ma-tool ma-tcheck">✓</span></div><div class="ma-seq-lbl">Entwurf · Faktencheck · bestätigt</div></div></div>`;
  }
  if(id==='orch'){
    // Sequenz: N → G → N → C
    return `<div class="meth-anchor"><div class="ma-seq"><div class="ma-seq-row"><span class="ma-tool ma-tn">N</span><span class="ma-arrow">→</span><span class="ma-tool ma-tg">G</span><span class="ma-arrow">→</span><span class="ma-tool ma-tn">N</span><span class="ma-arrow">→</span><span class="ma-tool ma-tc">C</span></div><div class="ma-seq-lbl">Tutor · Gem · Quellen · Anwendung</div></div></div>`;
  }
  return '';
}

// MODAL
function openModal(title,bodyHtml){
  document.getElementById('mTitle').textContent=title;
  document.getElementById('mBody').innerHTML=bodyHtml;
  document.getElementById('modal').classList.add('o');
}
function closeMo(e){if(e.target===document.getElementById('modal'))closeMoD()}
function closeMoD(){document.getElementById('modal').classList.remove('o')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMoD()});
function msec(title,content){return`<div class="msec"><div class="msec-t">${title}</div>${content}</div>`}
function mtxt(t){return`<div class="mtxt">${t}</div>`}
function mno(t){return`<div class="mno">${t}</div>`}

function openToolM(idx){
  const t=D.meta.tools[idx];
  const promptContent=t.globalPromptNote
    ?`<div style="font-family:var(--fm);font-size:.72rem;color:var(--pt);background:var(--ptg);border:1px solid var(--ptb);border-radius:var(--rs);padding:9px 12px;line-height:1.6">${t.globalPromptNote}</div>`
    :(t.globalPrompt?mtxt(t.globalPrompt):mno('Kein globaler System-Prompt konfiguriert.'));
  openModal(`${t.name} · Globaler System-Prompt`,
    msec('Geltungsbereich',`<div style="font-family:var(--fm);font-size:.7rem;color:var(--di)">Alle Chats mit ${t.name}, unabhängig von Projekten oder Notebooks.</div>`)+
    msec('Prompt',promptContent)
  );
}

function openPM(pid,e){
  if(e)e.stopPropagation();
  const p=D.prompts.find(x=>x.id===pid);if(!p)return;
  openModal(p.title,msec('Prompt',`<div class="ptbox" style="padding:0"><button class="cpbtn" onclick="cpTxt(event,'${pid}')">kopieren</button><pre class="ptxt">${p.text}</pre></div>`));

function openTM(title,text,e){
  if(e)e.stopPropagation();
  openModal(title,msec('Prompt',`<div class="ptbox" style="padding:0"><pre class="ptxt">${text}</pre></div>`));
}

function openGuide(tab){
  const labels={dashboard:'Dashboard',workflows:'Workflows',prompts:'Prompt-Bibliothek',journal:'Journal'};
  const lines=D.meta.guides[tab].split('\n');
  const html=lines.map((l,i)=>{

  openModal(`Anleitung · ${labels[tab]}`,`<div class="msec">${html}</div>`);
}

let _wfCat = 'Alle', _wfTag = 'Alle Tags';
function fWF(type, val, btn) {
  if (type === 'cat') {
    _wfCat = val;
    document.querySelectorAll('#wf-cf-cat .cb').forEach(b => b.classList.remove('a'));
  } else {
    _wfTag = val;
    document.querySelectorAll('#wf-cf-tag .cb').forEach(b => b.classList.remove('a'));
  }
  btn.classList.add('a');

  document.querySelectorAll('.wc').forEach(c => {
    const catOk = _wfCat === 'Alle' || c.dataset.cat === _wfCat;
    const tagsArr = c.dataset.tags ? c.dataset.tags.split(',') : [];
    const tagOk = _wfTag === 'Alle Tags' || tagsArr.includes(_wfTag);
    c.style.display = (catOk && tagOk) ? 'block' : 'none';
  });
}

  document.getElementById('prompts').innerHTML=`
<div class="sh"><h2 class="spt" style="display:flex;align-items:center;">Prompt-Bibliothek${WIP_BADGE}</h2><button class="guide-btn" onclick="openGuide('prompts')">? Anleitung</button></div>

<div class="plist">${list}</div>`;
}

let _pfZ='Alle',_pfT='Alle Typen',_pfW='Alle Workflows',_pfTool='Alle Tools',_pfTag='Alle Tags',_pfEnv='Alle';
function fP(e,row,val,btn){
  if(row==='zweck'){_pfZ=val;document.querySelectorAll('#cf1 .cb').forEach(b=>b.classList.remove('a'));}
  else if(row==='typ'){_pfT=val;document.querySelectorAll('#cf2 .cb').forEach(b=>b.classList.remove('a'));}
  else if(row==='wf'){_pfW=val;document.querySelectorAll('#cf3 .cb').forEach(b=>b.classList.remove('a'));}
  else if(row==='tool'){_pfTool=val;document.querySelectorAll('#cf4 .cb').forEach(b=>b.classList.remove('a'));}
  else if(row==='tag'){_pfTag=val;document.querySelectorAll('#cf5 .cb').forEach(b=>b.classList.remove('a'));}
  else if(row==='env'){_pfEnv=val;document.querySelectorAll('#cf6 .cb').forEach(b=>b.classList.remove('a'));}
  btn.classList.add('a');
  document.querySelectorAll('.pc').forEach(c=>{
    const zOk=_pfZ==='Alle'||c.dataset.zweck.split(', ').includes(_pfZ);
    const tOk=_pfT==='Alle Typen'||c.dataset.typ===_pfT;
    const wOk=_pfW==='Alle Workflows'||c.dataset.wf===_pfW;
    const lOk=_pfTool==='Alle Tools'||c.dataset.tool===_pfTool;
    const gOk=_pfTag==='Alle Tags'||(c.dataset.tags||'').split(',').includes(_pfTag);
    const eOk=_pfEnv==='Alle'||c.dataset.env===_pfEnv;
    c.style.display=(zOk&&tOk&&wOk&&lOk&&gOk&&eOk)?'block':'none';
  });
}
function tgPC(e,id){
  document.getElementById('pc-'+id).classList.toggle('o');
}

// JOURNAL
function renderJournal(){
  const jl=[...D.journal].reverse().map(j=>{
    let titleHtml = j.title.replace(/\[(Claude|Gemini|NotebookLM|Perplexity|Le Chat)\]/g, (match, tool) => {
      let tcKey = 'pt';
      if (tool === 'Claude') tcKey = 'cl';
      if (tool === 'Gemini') tcKey = 'gm';
      if (tool === 'NotebookLM') tcKey = 'nl';
      if (tool === 'Perplexity') tcKey = 'px';
      if (tool === 'Le Chat') tcKey = 'mi';
      const tc_ = TC[tcKey] || TC.pt;
      return `<span class="jtag" style="color:${tc_.c};border-color:${tc_.b};background:${tc_.g}">${tool}</span>`;
    });
    const lessons=(j.lessons||[]).map(l=>`<div class="lli">${l}</div>`).join('');
    return`<div class="je" id="je-${j.id}" onclick="tgJ('${j.id}')">
<div class="jeh"><div class="jdt">${j.date}</div><div class="ji"><div class="jt">${titleHtml}</div></div><button class="chev">&#9660;</button></div>
<div class="jeb"><p class="jcont">${j.content.replace(/\n/g,'<br>')}</p>${lessons?`<div class="llt">Lessons Learned</div>${lessons}`:''}</div>
</div>`;
  }).join('');

  const tl=(D.journalThematic||[]).map(t=>`<div class="te" id="te-${t.id}" onclick="tgTE('${t.id}')">
<div class="teh"><div class="te-icon">${t.icon}</div><div class="te-info"><div class="te-title">${t.title}</div><div class="te-hint">${t.hint}</div></div><button class="chev">&#9660;</button></div>
<div class="teb">${t.content}</div>
</div>`).join('');

  document.getElementById('journal').innerHTML=`
<div class="sh"><h2 class="spt" style="display:flex;align-items:center;">KI-Journal${WIP_BADGE}</h2><button class="guide-btn" onclick="openGuide('journal')">? Anleitung</button></div>
<div class="j-tabs">
  <button class="j-tab a" onclick="jTab('chrono',this)">Projektchronologie</button>
  <button class="j-tab" onclick="jTab('thematic',this)">Thematische Reflexion</button>
  <button class="j-tab" onclick="jTab('reflection',this)">Reflexion Lernprozess</button>
  <button class="j-tab" onclick="jTab('history',this)">🌱 Meine KI-Geschichte</button>
</div>
<div id="j-chrono" class="j-pane a">
  <div class="j-section-sub">Datierte Einträge · neueste zuerst</div>
  <div class="jl">${jl}</div>
</div>
<div id="j-thematic" class="j-pane">
  <div class="j-section-sub">Übergreifende Kapitel zu Methodik und Erkenntnissen</div>
  <div class="tl">${tl}</div>
</div>
<div id="j-reflection" class="j-pane">
  <div class="j-section-sub">Persönliche Reflexion über den Projektablauf</div>
  <p class="jcont" style="font-size: 1.05rem; line-height: 1.85;">Claude Code hätte die Entwicklung dieses Projekts einfach erheblich beschleunigt, was ich aber ganz bewusst ausgeklammert habe. Warum? Weil es mir um echten Kompetenzgewinn ging und nicht darum, meine Arbeit komplett zu delegieren und nichts zu checken. Also habe ich jeden einzelnen Schritt manuell nachvollzogen, mir von der KI erklären lassen und das Ganze direkt als Lernmaterial aufbereitet.</p>
  <p class="jcont" style="font-size: 1.05rem; line-height: 1.85;">SynapSpace ist mein erstes Projekt in dieser Komplexität. Die Vision und die Richtungsentscheidungen für Technologien und Architektur habe ich selbst getroffen, die technische Ausführung iterativ mit KI erarbeitet – mit dem festen Anspruch, jeden Schritt zu verstehen. Hat das immer geklappt? Ehrlich gesagt nein. Troubleshooting, ungeplante Hardware-Wartung und der normale Alltag haben ihren Tribut gefordert und manche Details laufen schneller als das Verständnis hinterherkommen kann. Die grundlegenden Architekturentscheidungen und ihre Begründungen verstehe ich. Die tiefere Implementierungsebene vertiefe ich gezielt weiter – denn das Projekt läuft nach der Bewerbungsphase nicht nur weiter, sondern es wird wachsen und mir mein restliches Leben beim Lernen helfen. Warten und sichern werde ich es selbst.</p>
</div>
<div id="j-history" class="j-pane">
  <div class="j-section-sub">Frühjahr 2024 bis Frühjahr 2026</div>
  <p class="jcont" style="font-size: 1.05rem; line-height: 1.85;">Also, ich bin vor ziemlich genau zwei Jahren, so im März oder April 2024, zum ersten Mal wirklich mit KI in Kontakt gekommen. Mein erstes Tool war damals ChatGPT, das ich anfangs nur privat und kostenlos genutzt habe. Meine damalige Arbeit in der Pflege und Assistenz von schwerbehinderten Menschen hat diese Notwendigkeit für den professionellen Einsatz einfach nicht erzeugt. Aber ich war vom ersten Moment an beeindruckt. Meine ersten Chats habe ich mir für meine Hobbys gebaut, beispielsweise einen gebildeten Cineasten, mit dem ich über Filme diskutieren konnte. Das war halt für mich als Filmfan ein super Einstieg.</p>
  <p class="jcont" style="font-size: 1.05rem; line-height: 1.85;">Ich muss sagen, ich habe dann recht früh, so im Sommer 2024, ein tieferes Potenzial erkannt. Ich habe der KI Rollen von historischen Persönlichkeiten gegeben, um mir Ratschläge für Karriere, Sport oder Krankheitsprävention zu holen. Natürlich stieß die Technik damals noch an ihre Grenzen, aber ich habe sofort den gewaltigen Impact gesehen. Wenn auch mir schnell bewusst wurde, dass diese Technik, wie jede andere auch, zwei Seiten hat, hatte ich irgendwie nie Angst vor dieser Veränderung. Im Gegenteil fokussierte ich mich auf das enorme positive Potenzial. Und da kam mir der Gedanke: Was bringt es uns, wenn wir eine KI einfach alles fragen können, wir sie aber nicht gezielt und mit Sinn und Verstand für echte Lösungen einsetzen? Ich wollte Apps bauen, die Menschen wirklich helfen.</p>
  <p class="jcont" style="font-size: 1.05rem; line-height: 1.85;">Dazu muss man wissen: Ich hatte vorher absolut nichts mit IT am Hut. Technik wurde in meiner Familie fast schon verteufelt. Ich war eher ein analoger Schaffer und Tüftler, fernab von Computern und seit Jahren ohne Social Media. Aber dieser Wunsch, sinnvolle KI-Anwendungen zu entwickeln, ließ mich nicht los. Also bin ich zur Agentur für Arbeit, habe mitgeteilt, dass ich in die IT möchte, bekam einen Bildungsgutschein und wollte eigentlich Anwendungsentwickler werden.</p>
  <p class="jcont" style="font-size: 1.05rem; line-height: 1.85;">Als dann im Oktober 2024 die Vorbereitungskurse für die Umschulung begannen, reifte in mir die Idee für mein Traumprojekt: Ein System, das anderen Menschen beim Lernen hilft und gleichzeitig als individueller Bildungs-Coach fungiert. Kurz nach dem Start der eigentlichen Umschulung im Frühjahr 2025 traf mich eine private Lebenskrise mit voller Wucht. Ich hatte den Kopf einfach nicht für die Schule und ließ mich ein halbes Jahr zurückstufen. In dieser schwierigen Zeit war KI mir tatsächlich eine kleine psychische Stütze. Ich nutzte das europäische Modell Le Chat von Mistral und promptete mir Seneca, Paul Watzlawick und Vera F. Birkenbihl – mögen sie in Frieden ruhen – als Gesprächspartner, um meine Situation zu reflektieren. Und zwar nicht nur einzeln: Ich habe die Chats damals schon so gebaut, dass sie voneinander wussten und sich, mit meiner Hilfe, gegenseitig Nachrichten austauschten. Das war, wenn man es heute so nennen will, mein erster eigener Multi-Agent-Versuch – irgendwie improvisiert, aber er hat funktioniert.</p>
  <p class="jcont" style="font-size: 1.05rem; line-height: 1.85;">Im Herbst 2025 lief mein Leben dann wieder in geordneten Bahnen. Zu diesem Zeitpunkt war auch die Entscheidung gefallen, nicht Anwendungsentwicklung, sondern Fachinformatiker für Systemintegration zu lernen. Warum? Weil mir klar wurde, dass Netzwerke, virtuelle Maschinen und Cyber Security halt genau die Infrastruktur sind, die man braucht, um KI-Anwendungen überhaupt bereitzustellen. Nicht der glamourösere Weg – aber der solidere.</p>
  <p class="jcont" style="font-size: 1.05rem; line-height: 1.85;">Im weiteren Verlauf habe ich dann massiv angefangen, KI-Tools zu orchestrieren und mir Workflows zu bauen. Von ChatGPT bin ich schon seit dem Sommer komplett weg. Perplexity kam dazu für die exzellente Quellenarbeit, Gemini überzeugte mich mit seinem riesigen Kontextfenster, NotebookLM hat mich mit der Generierung von Podcasts und eindrucksvollen Lernmaterialien geflasht. Und dann ist da noch Claude – das Tool, mit dem ich gerade SynapSpace entwickle. Wenn es um komplexe Projekte und saubere Logik geht, macht Claude momentan einfach niemandem etwas vor. Ich kombiniere all diese Tools geschickt miteinander, spare Limits und nutze jedes für das, was es am besten kann.</p>
  <p class="jcont" style="font-size: 1.05rem; line-height: 1.85;">SynapSpace ist dabei das Herzstück von allem. Die Idee, die mich seit Oktober 2024 nicht loslässt – ein intelligentes Lernsystem, das seine User zu verstehen lernt und ihnen hilft, schlauer und stärker zu werden – ist heute kein Traum mehr, sondern ein aktives Projekt. Heute stehe ich genau da, wo ich sein will. Und bis dieser Traum in seiner vollen Form wahr wird, eigne ich mir halt genau die Fähigkeiten an, die ich dafür brauche.</p>
</div>`;
}
